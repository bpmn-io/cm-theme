<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@bpmn-io/cm-theme</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 1.4em;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .editor {
      border: 1px solid #ccc;
      margin-bottom: 24px;
    }

    button {
      margin-bottom: 16px;
      padding: 6px 12px;
      cursor: pointer;
    }

    a {
      color: #0969da;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #1e1e1e;
        color: #ccc;
      }

      a {
        color: #58a6ff;
      }

      .editor {
        border-color: #444;
      }
    }
  </style>
</head>
<body>
  <h1>@bpmn-io/cm-theme</h1>
  <p><a href="https://github.com/bpmn-io/cm-theme">View on GitHub</a></p>
  <button id="toggle">Toggle dark</button>

  <label>FEEL</label>
  <div class="editor" id="feel-editor"></div>

  <label>JSON</label>
  <div class="editor" id="json-editor"></div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
